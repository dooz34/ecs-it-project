name: Terraform Apply
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="container_image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/ecs-portfolio:latest"
      - name: Post-deploy health check
        run: |
          URL="https://${{ secrets.APP_DOMAIN }}/"
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=15

          echo "Waiting for DNS, ALB, and ECS service to settle..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "Health check passed - $URL returned $STATUS (attempt $i/$MAX_ATTEMPTS)"
              exit 0
            fi

            echo "Attempt $i/$MAX_ATTEMPTS: $URL not ready yet (status: $STATUS). Retrying in ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

          echo "Health check FAILED after $MAX_ATTEMPTS attempts - $URL never returned 200"
          exit 1